[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readiness.index"
version = "0.2.0"
description = "Measure AI readiness the way an auditor would: respondent-level scoring against a documented instrument, rater agreement, bootstrap intervals, role perception gaps, evidence audit, an exact prerequisite-aware roadmap and CI gates. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[project.scripts]
readiness-index = "readiness_index.cli:main"

[tool.setuptools.package-data]
readiness_index = ["py.typed"]

[tool.setuptools.packages.find]
include = ["readiness_index*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["readiness_index"]
